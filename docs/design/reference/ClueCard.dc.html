<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;box-sizing:border-box;background:linear-gradient(180deg,rgba(52,40,110,.55),rgba(24,18,56,.6));border:1px solid {{ border }};border-radius:{{ rad }}px;padding:{{ pad }};display:flex;flex-direction:column;align-items:center;gap:6px;font-family:Rubik,system-ui,sans-serif;color:#F4F2FB">
<sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:5px;font:700 10px/1 Rubik,sans-serif;letter-spacing:.12em;color:#FF8FB8"><span style="width:7px;height:7px;border-radius:50%;background:#FF6FA3;box-shadow:0 0 8px #FF6FA3"></span>LIVE</span></sc-if>
<span style="font:600 {{ ls }}px/1 Rubik,sans-serif;letter-spacing:.16em;color:{{ labelColor }};text-align:center;white-space:nowrap">{{ label }}</span>
<sc-if value="{{ editable }}" hint-placeholder-val="{{ false }}"><input value="{{ val }}" onChange="{{ onType }}" placeholder="{{ placeholder }}" style="width:100%;box-sizing:border-box;height:{{ lh }}px;text-align:center;background:transparent;border:none;outline:none;color:#fff;font:600 {{ fs }}px/1 Fredoka,Rubik,sans-serif"></input></sc-if>
<sc-if value="{{ notEditable }}" hint-placeholder-val="{{ true }}"><span style="font:600 {{ fs }}px/{{ lh }}px Fredoka,Rubik,sans-serif;white-space:nowrap">{{ clue }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ALEX'S CLUE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Coffee&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;gold&quot;,&quot;nova&quot;,&quot;live&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;editable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Type a clue…&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { val: '' };
  renderVals() {
    const p = this.props, tone = p.tone ?? 'default', lg = p.size === 'lg';
    const T = { default: ['rgba(200,180,255,.12)', '#A9A3C9'], gold: ['rgba(255,209,102,.5)', '#FFD166'], nova: ['rgba(91,214,255,.5)', '#8FE3FF'], live: ['rgba(200,180,255,.12)', '#A9A3C9'] }[tone];
    return {
      border: T[0], labelColor: T[1], isLive: tone === 'live',
      label: p.label ?? '', clue: p.clue ?? '', placeholder: p.placeholder ?? 'Type a clue…',
      editable: !!p.editable, notEditable: !p.editable,
      val: this.state.val, onType: e => this.setState({ val: e.target.value }),
      fs: lg ? 52 : 36, lh: lg ? 58 : 44, ls: lg ? 12 : 11, rad: lg ? 22 : 18, pad: lg ? '16px 18px' : '12px 14px'
    };
  }
}
</script>
</body>
</html>
