<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;font-family:Rubik,system-ui,sans-serif">
<sc-for list="{{ teams }}" as="t" hint-placeholder-count="2">
<div style="border-radius:18px;padding:10px 8px;background:linear-gradient(180deg,rgba(52,40,110,.6),rgba(24,18,56,.65));border:1.5px solid {{ t.border }};box-shadow:{{ t.shadow }};opacity:{{ t.op }};display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;justify-content:center;gap:8px">
<span style="font:600 15px/1 Rubik,sans-serif;color:#F4F2FB;white-space:nowrap">{{ t.name }}</span>
<span style="font:700 30px/1 Fredoka,Rubik,sans-serif;color:{{ t.color }}">{{ t.score }}</span>
</div>
<div style="display:flex;justify-content:space-around">
<sc-for list="{{ t.players }}" as="p" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0">
<div style="width:40px;height:40px;border-radius:50%;background:{{ p.bg }};display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:{{ p.ring }}">{{ p.e }}</div>
<span style="font:500 11px/1 Rubik,sans-serif;color:#D3CEEA">{{ p.n }}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:110},&quot;comets&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;novas&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comets&quot;,&quot;novas&quot;,&quot;none&quot;],&quot;default&quot;:&quot;comets&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;psychic&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Alex&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, active = p.active ?? 'comets', psychic = p.psychic ?? 'Alex';
    const C = [{ n: 'Alex', e: '🦊', bg: '#F4A259' }, { n: 'Jordan', e: '🐙', bg: '#F6D060' }, { n: 'Taylor', e: '🌮', bg: '#7ED3A4' }];
    const N = [{ n: 'Casey', e: '🐸', bg: '#5CC8F0' }, { n: 'Morgan', e: '🦄', bg: '#B889E8' }, { n: 'Riley', e: '🍩', bg: '#F59BC0' }];
    const mk = (id, name, score, color, pl) => {
      const on = active === id;
      return { name, score, color, op: active === 'none' || on ? 1 : 0.7,
        border: on ? color + 'AA' : 'rgba(200,180,255,.1)', shadow: on ? `0 0 24px ${color}40` : 'none',
        players: pl.map(x => ({ ...x, ring: x.n === psychic ? '0 0 0 2px #120F2E, 0 0 0 4px #FFD166' : 'none' })) };
    };
    return { teams: [mk('comets', 'Comets', p.comets ?? 7, '#FF6FA3', C), mk('novas', 'Novas', p.novas ?? 5, '#5BD6FF', N)] };
  }
}
</script>
</body>
</html>
