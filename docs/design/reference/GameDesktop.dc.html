<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;border-radius:20px;background:#09081A;color:#F4F2FB;font-family:Rubik,system-ui,sans-serif">
<dc-import name="Starfield" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
<div style="position:relative;height:100%;box-sizing:border-box;padding:24px 36px 28px;display:grid;grid-template-columns:280px minmax(0,1fr) 280px;grid-template-rows:auto minmax(0,1fr);gap:20px 32px">
<div style="grid-column:1 / -1"><dc-import name="GameHeader" round="{{ 3 }}" total="{{ 5 }}" room="KRTZ" hint-size="100%,44px"></dc-import></div>
<div style="align-self:start"><dc-import name="TeamPanel" team="comets" score="{{ c.comets }}" status="{{ c.cS }}" active="{{ c.cA }}" psychic="{{ c.psychic }}" hint-size="100%,340px"></dc-import></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;min-height:0">
<div style="width:100%;max-width:520px"><dc-import name="ClueCard" size="lg" label="{{ c.label }}" clue="{{ c.clue }}" tone="{{ c.tone }}" editable="{{ c.editable }}" hint-size="100%,110px"></dc-import></div>
<div style="width:470px;display:flex;flex-direction:column;gap:4px"><dc-import name="Dial" value="{{ c.dial }}" target="{{ 0.66 }}" show-bands="{{ c.bands }}" interactive="{{ c.interactive }}" hint-size="100%,326px"></dc-import>
<sc-if value="{{ hasHint }}" hint-placeholder-val="{{ false }}"><span style="text-align:center;font:400 14px Rubik,sans-serif;color:#A9A3C9">{{ c.hint }}</span></sc-if></div>
<sc-if value="{{ aClue }}" hint-placeholder-val="{{ false }}"><div style="width:470px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px"><dc-import name="Btn" label="Said it out loud" kind="secondary" size="lg" hint-size="100%,62px"></dc-import><dc-import name="Btn" label="Send clue" kind="primary" size="lg" hint-size="100%,62px"></dc-import></div></sc-if>
<sc-if value="{{ aNote }}" hint-placeholder-val="{{ false }}"><div style="width:470px;height:60px;border-radius:999px;border:1px dashed rgba(200,180,255,.25);display:flex;align-items:center;justify-content:center;font:500 16px Rubik,sans-serif;color:#A9A3C9">{{ c.note }}</div></sc-if>
<sc-if value="{{ aGuess }}" hint-placeholder-val="{{ false }}"><div style="width:340px"><dc-import name="Btn" label="Lock it in" kind="primary" size="lg" hint-size="100%,62px"></dc-import></div></sc-if>
<sc-if value="{{ aBet }}" hint-placeholder-val="{{ false }}"><div style="width:470px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px">
<button onClick="{{ betLeft }}" style="height:62px;border-radius:999px;border:{{ bL.border }};background:{{ bL.bg }};color:{{ bL.color }};box-shadow:{{ bL.shadow }};font:700 19px Rubik,sans-serif;cursor:pointer;transition:all .15s">⟵ Left</button>
<button onClick="{{ betRight }}" style="height:62px;border-radius:999px;border:{{ bR.border }};background:{{ bR.bg }};color:{{ bR.color }};box-shadow:{{ bR.shadow }};font:700 19px Rubik,sans-serif;cursor:pointer;transition:all .15s">Right ⟶</button>
<dc-import name="Btn" label="Lock bet" kind="primary" size="lg" hint-size="100%,62px"></dc-import>
</div></sc-if>
<sc-if value="{{ aBetWait }}" hint-placeholder-val="{{ false }}"><div style="width:470px;height:62px;border-radius:999px;background:rgba(91,214,255,.1);border:1px solid rgba(91,214,255,.4);display:flex;align-items:center;justify-content:center;gap:10px;font:600 17px Rubik,sans-serif">Novas are betting… <span style="color:#BDEBFF;font-weight:500">2 of 3 picked</span></div></sc-if>
<sc-if value="{{ aReveal }}" hint-placeholder-val="{{ false }}"><div style="width:470px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 150px;gap:12px">
<div style="height:62px;border-radius:999px;background:rgba(255,111,163,.14);border:1.5px solid rgba(255,111,163,.55);display:flex;align-items:center;justify-content:center;gap:8px"><span style="font:700 28px/1 Fredoka,Rubik,sans-serif;color:#FF6FA3">+3</span><span style="font:600 14px Rubik,sans-serif">Comets</span></div>
<div style="height:62px;border-radius:999px;background:rgba(91,214,255,.12);border:1.5px solid rgba(91,214,255,.5);display:flex;align-items:center;justify-content:center;gap:8px"><span style="font:700 28px/1 Fredoka,Rubik,sans-serif;color:#5BD6FF">+1</span><span style="font:600 14px Rubik,sans-serif">Novas ✓</span></div>
<dc-import name="Btn" label="Next turn" kind="primary" size="lg" hint-size="100%,62px"></dc-import>
</div></sc-if>
<div style="width:470px"><dc-import name="Soundboard" hint-size="100%,64px"></dc-import></div>
</div>
<div style="align-self:start"><dc-import name="TeamPanel" team="novas" score="{{ c.novas }}" status="{{ c.nS }}" active="{{ c.nA }}" psychic="{{ c.psychic }}" hint-size="100%,340px"></dc-import></div>
</div>
<sc-if value="{{ isMenu }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:rgba(5,4,14,.65);display:flex;align-items:center;justify-content:center">
<div style="width:460px;border-radius:28px;background:linear-gradient(180deg,#221B4F,#130F30);border:1px solid rgba(200,180,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.5);padding:24px 26px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font:700 22px Rubik,sans-serif">Host controls</span><span style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font:500 18px Rubik,sans-serif;color:#A9A3C9">✕</span></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:54px"><span style="font:500 16px Rubik,sans-serif">Noises for everyone</span><button onClick="{{ toggleNoise }}" style="width:52px;height:32px;border-radius:999px;border:none;padding:3px;background:{{ noiseTrack }};display:flex;justify-content:{{ noiseJustify }};cursor:pointer;transition:all .2s"><span style="width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)"></span></button></div>
<sc-for list="{{ muteList }}" as="m" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;height:54px;border-top:1px solid rgba(200,180,255,.08)">
<span style="width:38px;height:38px;border-radius:50%;background:{{ m.bg }};display:flex;align-items:center;justify-content:center;font-size:20px">{{ m.e }}</span>
<span style="flex:1;font:500 16px Rubik,sans-serif">{{ m.n }}</span>
<span style="font:500 13px Rubik,sans-serif;color:#FF8FB8">{{ m.status }}</span>
<button onClick="{{ m.tap }}" style="height:40px;min-width:96px;padding:0 16px;border-radius:999px;background:{{ m.btnBg }};border:1px solid {{ m.btnBorder }};color:#F4F2FB;font:600 14px Rubik,sans-serif;cursor:pointer">{{ m.label }}</button>
</div>
</sc-for>
<div style="display:flex;align-items:center;height:54px;border-top:1px solid rgba(200,180,255,.08)"><span style="flex:1;font:500 16px Rubik,sans-serif;color:#FF8FB8">Force-skip Alex's turn</span><span style="font:500 20px Rubik,sans-serif;color:#A9A3C9">›</span></div>
<div style="display:flex;align-items:center;height:54px;border-top:1px solid rgba(200,180,255,.08)"><span style="flex:1;font:500 16px Rubik,sans-serif">End game for everyone</span><span style="font:500 20px Rubik,sans-serif;color:#A9A3C9">›</span></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;clue&quot;,&quot;waitClue&quot;,&quot;guess&quot;,&quot;watch&quot;,&quot;bet&quot;,&quot;betWait&quot;,&quot;reveal&quot;,&quot;hostMenu&quot;],&quot;default&quot;:&quot;guess&quot;,&quot;tsType&quot;:&quot;'clue' | 'waitClue' | 'guess' | 'watch' | 'bet' | 'betWait' | 'reveal' | 'hostMenu'&quot;}}">
class Component extends DCLogic {
  state = { bet: 'right', noise: true, muted: { Riley: true } };
  renderVals() {
    const s = this.state, set = o => this.setState(o), st = this.props.state ?? 'guess';
    const base = { label: "ALEX'S CLUE", clue: 'Coffee', tone: 'default', editable: false, psychic: 'Alex', comets: 7, novas: 5, dial: 0.5, bands: false, interactive: false, hint: '', note: '', act: '', cA: true, nA: false, cS: 'GUESSING', nS: 'BETS NEXT' };
    const S = {
      clue: { label: 'ONLY YOU SEE THE TARGET', clue: '', tone: 'gold', editable: true, bands: true, act: 'clue', cS: 'PSYCHIC IS CLUING' },
      waitClue: { label: "COMETS' TURN", clue: 'Alex is thinking…', act: 'note', note: "Next: you'll bet left or right", cS: 'PSYCHIC IS CLUING' },
      guess: { dial: 0.42, interactive: true, hint: 'Drag the needle · your team sees it move live', act: 'guess' },
      watch: { label: 'COMETS ARE GUESSING', tone: 'live', dial: 0.61, act: 'note', note: 'Get ready to bet left or right' },
      bet: { label: 'LEFT OR RIGHT OF THEIR GUESS?', tone: 'nova', dial: 0.58, act: 'bet', cA: false, nA: true, cS: 'GUESS LOCKED', nS: 'BETTING' },
      betWait: { label: "GUESS LOCKED · ALEX'S CLUE", dial: 0.58, act: 'betWait', cA: false, nA: true, cS: 'GUESS LOCKED', nS: 'BETTING' },
      reveal: { label: 'REVEALED', tone: 'gold', psychic: '', comets: 10, novas: 6, dial: 0.58, bands: true, act: 'reveal', cA: true, nA: true, cS: '+3 THIS TURN', nS: '+1 THIS TURN' },
      hostMenu: { dial: 0.42, act: 'guess' }
    };
    const c = { ...base, ...(S[st] || S.guess) };
    const on = { border: '2px solid #FFD166', bg: 'rgba(255,209,102,.18)', color: '#fff', shadow: '0 0 22px rgba(255,209,102,.4)' };
    const off = { border: '1px solid rgba(200,180,255,.18)', bg: 'rgba(255,255,255,.07)', color: '#D3CEEA', shadow: 'none' };
    const rows = [['🐙', 'Jordan', '#F6D060'], ['🌮', 'Taylor', '#7ED3A4'], ['🐸', 'Casey', '#5CC8F0'], ['🦄', 'Morgan', '#B889E8'], ['🍩', 'Riley', '#F59BC0']];
    return {
      c, hasHint: !!c.hint, isMenu: st === 'hostMenu',
      aClue: c.act === 'clue', aNote: c.act === 'note', aGuess: c.act === 'guess', aBet: c.act === 'bet', aBetWait: c.act === 'betWait', aReveal: c.act === 'reveal',
      betLeft: () => set({ bet: 'left' }), betRight: () => set({ bet: 'right' }),
      bL: s.bet === 'left' ? on : off, bR: s.bet === 'right' ? on : off,
      toggleNoise: () => set({ noise: !s.noise }), noiseTrack: s.noise ? '#FFC94D' : 'rgba(255,255,255,.18)', noiseJustify: s.noise ? 'flex-end' : 'flex-start',
      muteList: rows.map(([e, n, bg]) => { const m = !!s.muted[n]; return { e, n, bg, status: m ? '0:21' : '', label: m ? 'Unmute' : 'Mute 30s',
        btnBg: m ? 'rgba(255,111,163,.18)' : 'rgba(255,255,255,.07)', btnBorder: m ? 'rgba(255,111,163,.5)' : 'rgba(200,180,255,.18)', tap: () => set({ muted: { ...s.muted, [n]: !m } }) }; })
    };
  }
}
</script>
</body>
</html>
