<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 0;font-family:Rubik,system-ui,sans-serif">
<sc-for list="{{ sounds }}" as="s" hint-placeholder-count="8">
<button onClick="{{ s.tap }}" style="flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:0;cursor:pointer;opacity:{{ dim }}" style-active="transform:scale(.9)">
<span style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:{{ s.bg }};border:1px solid rgba(255,255,255,.12);box-shadow:{{ s.glow }};transition:all .2s">{{ s.e }}</span>
<span style="font:500 10px/1 Rubik,sans-serif;color:#93A2BF;white-space:nowrap">{{ s.n }}</span>
</button>
</sc-for>
<sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="padding:8px 14px;border-radius:999px;background:#221B4F;border:1px solid rgba(200,180,255,.2);font:600 13px Rubik,sans-serif;color:#F4F2FB">Host muted you · 0:21</span></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:70},&quot;muted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { hit: null };
  renderVals() {
    const list = [['📯', 'Airhorn'], ['🥁', 'Drumroll'], ['👏', 'Applause'], ['🎺', 'Trombone'], ['👎', 'Boo'], ['🦗', 'Crickets'], ['😱', 'Gasp'], ['🎉', 'Ta-da']];
    const muted = !!this.props.muted;
    return {
      muted, dim: muted ? 0.25 : 1,
      sounds: list.map(([e, n], i) => ({ e, n,
        bg: this.state.hit === i ? 'rgba(255,209,102,.35)' : 'rgba(255,255,255,.07)',
        glow: this.state.hit === i ? '0 0 18px rgba(255,209,102,.6)' : 'none',
        tap: () => { this.setState({ hit: i }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ hit: null }), 450); } }))
    };
  }
}
</script>
</body>
</html>
